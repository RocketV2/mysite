<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日记编辑器 — 我的日记</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="editor-header">
    <div class="editor-header-left">
      <a href="index.html" class="back-link">← 返回日记</a>
      <a href="market-review.html" class="back-link" style="margin-left:12px;">📈 复盘</a>
      <h1 class="editor-title">日记编辑器</h1>
    </div>
    <div class="editor-header-right">
      <button id="btn-new" class="toolbar-btn toolbar-btn-primary">新建日记</button>
      <button id="btn-import-json" class="toolbar-btn">导入 JSON</button>
      <button id="btn-import-md" class="toolbar-btn">导入 Markdown</button>
      <button id="btn-export-json" class="toolbar-btn">导出 JSON</button>
      <button id="btn-export-md" class="toolbar-btn">导出 Markdown</button>
      <button id="btn-reload" class="toolbar-btn toolbar-btn-muted" title="从 entries.json 重新加载（丢弃本地修改）">重新加载</button>
    </div>
  </header>

  <div class="editor-layout" id="editor-layout">
    <!-- 侧边栏：日记列表 -->
    <aside class="editor-sidebar" id="editor-sidebar">
      <div class="sidebar-search">
        <input type="search" id="sidebar-search-input" class="sidebar-search-input" placeholder="搜索条目...">
      </div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-loading">加载中...</div>
      </div>
      <div class="sidebar-status" id="sidebar-status">
        <span id="entry-count">0 条日记</span>
      </div>
    </aside>

    <!-- 主编辑区 -->
    <main class="editor-main" id="editor-main">
      <!-- 空状态：未选中条目 -->
      <div class="editor-empty" id="editor-empty">
        <div class="editor-empty-icon">📝</div>
        <p>选择左侧条目开始编辑</p>
        <p>或</p>
        <button id="btn-new-empty" class="toolbar-btn toolbar-btn-primary">新建一篇日记</button>
      </div>

      <!-- 编辑表单 -->
      <div class="editor-form" id="editor-form" style="display:none;">
        <!-- 元数据行 -->
        <div class="meta-row">
          <div class="meta-field">
            <label for="entry-date">日期</label>
            <input type="date" id="entry-date" class="meta-input">
          </div>
          <div class="meta-field">
            <label for="entry-mood">心情</label>
            <select id="entry-mood" class="meta-input">
              <option value="">无</option>
              <option value="happy">😊 开心</option>
              <option value="sad">😢 难过</option>
              <option value="neutral">😐 平静</option>
              <option value="excited">🎉 兴奋</option>
              <option value="anxious">😰 焦虑</option>
            </select>
          </div>
          <div class="meta-field meta-field-title">
            <label for="entry-title">标题</label>
            <input type="text" id="entry-title" class="meta-input" placeholder="日记标题（可选）">
          </div>
        </div>
        <div class="meta-row">
          <div class="meta-field meta-field-tags">
            <label>标签</label>
            <div class="tag-input-container" id="tag-input-container">
              <div class="tag-chips" id="tag-chips"></div>
              <input type="text" id="tag-add-input" class="tag-add-input" placeholder="输入标签，回车添加">
            </div>
          </div>
        </div>

        <!-- 编辑/预览区 -->
        <div class="editor-panes">
          <div class="pane pane-editor">
            <div class="pane-header">
              <span class="pane-title">Markdown 编辑</span>
              <div class="pane-header-actions">
                <button id="btn-insert-media" class="toolbar-btn toolbar-btn-sm" title="插入媒体">🎬 媒体</button>
                <span class="save-indicator" id="save-indicator">已保存</span>
              </div>
            </div>
            <textarea id="entry-content" class="content-textarea" placeholder="在此编写 Markdown 内容..."></textarea>
          </div>
          <div class="pane pane-preview">
            <div class="pane-header">
              <span class="pane-title">预览</span>
            </div>
            <div class="preview-content" id="preview-content"></div>
          </div>
        </div>

        <!-- 移动端：编辑/预览切换 -->
        <div class="mobile-pane-tabs" id="mobile-pane-tabs">
          <button class="pane-tab active" data-pane="edit">编辑</button>
          <button class="pane-tab" data-pane="preview">预览</button>
        </div>

        <!-- 操作栏 -->
        <div class="editor-actions">
          <span class="entry-id-label" id="entry-id-label"></span>
          <button id="btn-delete" class="toolbar-btn toolbar-btn-danger">删除此日记</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="file-input-json" accept=".json" style="display:none;">
  <input type="file" id="file-input-md" accept=".md,.markdown,.txt" style="display:none;">
  <input type="file" id="file-input-image" accept="image/*" style="display:none;">
  <input type="file" id="file-input-video" accept="video/*" style="display:none;">
  <input type="file" id="file-input-audio" accept="audio/*" style="display:none;">

  <!-- 媒体插入弹窗 -->
  <div class="image-dialog-overlay" id="media-dialog" style="display:none;">
    <div class="image-dialog">
      <h3 class="image-dialog-title">插入媒体</h3>
      <!-- 媒体类型选择 -->
      <div class="image-dialog-tabs" id="media-type-tabs">
        <button class="image-dialog-tab active" data-media="image">🖼 图片</button>
        <button class="image-dialog-tab" data-media="video">🎬 视频</button>
        <button class="image-dialog-tab" data-media="audio">🎵 音频</button>
      </div>
      <!-- 来源选择 -->
      <div class="image-dialog-tabs" id="media-source-tabs" style="margin-top:4px; border-bottom:1px solid var(--color-border);">
        <button class="image-dialog-tab active" data-tab="url">🔗 粘贴 URL</button>
        <button class="image-dialog-tab" data-tab="file">📁 选择文件</button>
        <button class="image-dialog-tab" data-tab="path">📂 仓库路径</button>
      </div>
      <!-- Tab: URL -->
      <div class="image-dialog-panel" id="panel-url">
        <input type="text" id="media-url-input" class="image-dialog-input" placeholder="">
        <input type="text" id="media-url-alt" class="image-dialog-input" placeholder="描述文本（可选）">
      </div>
      <!-- Tab: 文件 -->
      <div class="image-dialog-panel" id="panel-file" style="display:none;">
        <div class="image-file-drop" id="media-file-drop">
          <p>点击选择文件</p>
          <p class="image-file-hint" id="media-file-hint">转换为 Base64 内嵌（适合小文件）</p>
        </div>
        <p class="image-warning" id="media-file-warning" style="display:none;">⚠ 文件较大，建议使用仓库路径方式存储</p>
      </div>
      <!-- Tab: 路径 -->
      <div class="image-dialog-panel" id="panel-path" style="display:none;">
        <p class="image-path-hint" id="media-path-hint">将文件放入仓库目录，然后输入相对路径：</p>
        <input type="text" id="media-path-input" class="image-dialog-input" placeholder="">
        <input type="text" id="media-path-alt" class="image-dialog-input" placeholder="描述文本（可选）">
      </div>
      <div class="image-dialog-actions">
        <button class="toolbar-btn" id="btn-media-cancel">取消</button>
        <button class="toolbar-btn toolbar-btn-primary" id="btn-media-insert">插入</button>
      </div>
    </div>
  </div>

  <script src="js/editor.js"></script>
</body>
</html>
