<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市场复盘 — 我的日记</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/market-review.css">
</head>
<body>
  <noscript>
    <div class="noscript-banner">
      此网站需要 JavaScript 来渲染内容。请启用 JavaScript 后刷新页面。
    </div>
  </noscript>

  <header class="site-header">
    <div class="header-top">
      <h1 class="site-title">市场复盘</h1>
      <div class="header-actions">
        <a href="index.html" class="editor-link" title="返回日记">📔 日记</a>
        <a href="editor.html" class="editor-link" title="打开编辑器">✏️ 编辑</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换暗色/亮色模式">
          <span class="theme-icon-light">☀️</span>
          <span class="theme-icon-dark">🌙</span>
        </button>
      </div>
    </div>
    <div class="header-controls">
      <div class="review-nav">
        <button id="nav-prev" class="nav-btn" title="前一天">◀</button>
        <input type="date" id="date-picker" class="date-picker">
        <button id="nav-next" class="nav-btn" title="后一天">▶</button>
        <button id="nav-latest" class="nav-btn nav-btn-latest">最新</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="main-content">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
    <div id="error" class="error" style="display:none;">
      <p>加载复盘数据失败。</p>
      <p>如果你在本地查看此页面，请尝试使用本地服务器：</p>
      <code>python3 -m http.server 9898</code>
      <p>然后访问 <a href="http://localhost:9898/market-review.html">http://localhost:9898/market-review.html</a></p>
    </div>
    <div id="review-container" style="display:none;"></div>
    <div id="no-data" class="no-results" style="display:none;">
      <p>暂无该日期的复盘数据</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>我的日记 — 市场复盘模块</p>
  </footer>

  <script src="js/market-review.js"></script>
</body>
</html>
